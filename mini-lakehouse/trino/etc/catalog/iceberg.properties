connector.name=iceberg

# --- Catalog: Nessie's Iceberg REST endpoint ---------------------------------
# Chosen over iceberg.catalog.type=nessie so ONE catalog serves Trino and
# PyIceberg/DuckDB alike (gives a zero-container fallback path against the same tables).
# RISK: the branch is part of the path. Nessie serves REST at /iceberg/<ref>.
#       If Trino reports "catalog not found", curl the URI directly -- see
#       docs/TROUBLESHOOTING.md #2 for the older iceberg.catalog.type=nessie fallback.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/main
iceberg.rest-catalog.warehouse=warehouse

# --- Object storage: SeaweedFS speaking S3 -----------------------------------
# fs.native-s3.enabled=true is MANDATORY here. The older Hive-style s3 config
# will not work with this connector.
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
# path-style is REQUIRED locally and WRONG on real S3 (which wants virtual-hosted).
# This single property is the most common failure when moving to AWS.
s3.path-style-access=true
s3.aws-access-key=lakehouse
s3.aws-secret-key=lakehouse-local-secret
