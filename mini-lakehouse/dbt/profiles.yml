# Local profile. On AWS only this block changes -- the models do not.
mini_lakehouse:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: dbt
      catalog: iceberg
      schema: silver
      threads: 4
